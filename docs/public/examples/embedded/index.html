<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Example: Embedded integration</title>
    <link rel="stylesheet" href="/docs/examples/examples.css" />

  <body>
    <header><img src="/docs/brand/hypotech-logo.svg" alt="hypotech" /><a href="/docs/">Back to docs</a></header>

      <div class="example-head">
        <div><h1>Embedded integration</h1><p>The recommended integration: in your page flow, no iframe.</p></div>
