<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Example: Direct iframe</title>
    <link rel="stylesheet" href="/docs/examples/examples.css" />
  </head>
  <body>
    <header><strong>Integration example</strong><a href="/docs/">Back to docs</a></header>
    <main>
      <div class="example-head">
        <div><h1>Direct iframe</h1><p>Manual origin and source-window validation.</p></div>
        <span class="status" id="status" role="status">Loading widget…</span>
      </div>
      <div class="widget-host">
        <iframe
          class="widget-frame"
          id="hypotech-financing-widget"
          src="https://hypotech-widget.vercel.app/v1/widget/heim-leben/?project=schoenauer-weg&unit=7&parking=hub&household=joint"
          title="Financing guidance by hypo.tech"
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin"
          sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin"
        ></iframe>
      </div>
    </main>
    <script src="/docs/examples/basic-iframe.js" defer></script>
  </body>
</html>
