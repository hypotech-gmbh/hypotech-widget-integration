name: Integration question
description: Technical question about the public widget integration
title: "[Integration] "
labels:
  - integration
body:
  - type: markdown
    attributes:
      value: |
        Do not post personal data, credentials, contracts or confidential project information. Report vulnerabilities privately.
  - type: input
    id: public_origin
    attributes:
      label: Public staging origin
      description: Origin only, with no credentials or paths. Example: https://staging.partner.de
      placeholder: https://staging.partner.de
  - type: input
    id: project
    attributes:
      label: Public project slug
      placeholder: schoenauer-weg
  - type: textarea
    id: problem
    attributes:
      label: Observed behavior
      description: Include steps, expected behavior and browser. Use synthetic test data only.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: I removed all personal, confidential and security-sensitive information.
          required: true
